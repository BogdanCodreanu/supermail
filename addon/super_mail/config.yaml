name: SuperMail
version: "0.1.16"
slug: super_mail
description: >-
  Self-hosted, keyboard-first Gmail client. Listens on 127.0.0.1:8787 only; put your HTTPS reverse
  proxy in front of it. Index, body cache and the token key in the app's /data; the Google OAuth
  client JSON in the app's config folder as client_secret.json.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
host_network: true
map:
  - addon_config:rw
# The refresh-token key never goes into HA backups; restoring a backup means "Reconnect" per account.
backup_exclude:
  - "secret.key"
options:
  # Required: the app explains on startup what is missing.
  owner_email: ""
  public_url: ""
  port: 8787
  body_cache_mb: 1024
  index_mb: 1024
  logs_mb: 50
  total_mb: 3072
  min_free_disk_gb: 20
schema:
  # Plain strings so the empty defaults pass the Supervisor; the server validates both.
  owner_email: str
  public_url: str
  port: port
  body_cache_mb: int(100,20000)
  index_mb: int(100,20000)
  logs_mb: int(10,1000)
  total_mb: int(500,50000)
  min_free_disk_gb: int(1,500)
